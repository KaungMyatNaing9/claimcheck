[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimcheck"
version = "0.2.0"
description = "Check README claims against code and benchmark files. Pre-alpha, milestone 2."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ClaimCheck contributors" }]
keywords = ["readme", "claims", "llm", "evaluation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
claimcheck = "claimcheck.cli:main"

[tool.setuptools]
packages = ["claimcheck"]

[tool.setuptools.package-data]
claimcheck = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["claimcheck", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
